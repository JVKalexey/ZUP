<p class="Usual">Обработка используется для автоматического формирования документа «Авансовый платеж иностранца по НДФЛ» по сотрудникам, которые вносили плату за патент. Используется только в конфигурациях, где присутствует данный документ (ЗУП, ERP).</p></body></html>
