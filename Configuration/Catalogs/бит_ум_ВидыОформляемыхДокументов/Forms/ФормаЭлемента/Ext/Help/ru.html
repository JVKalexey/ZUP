<h1>Виды оформляемых документов</h1>

<p class="Usual">Справочник содержит отчетные формы документов для сдачи обязательной отчетности при работе с иностранными гражданами, утвержденные законодательно на территории Российской Федерации.</p>
<p class="Usual">Приведенные формы отчетности доступны для редактирования.</p>
