<p><span style="FONT-WEIGHT: bold">Справочник «AI-модели»</span></p>
<p style="TEXT-ALIGN: justify"> </p>
<p style="TEXT-ALIGN: justify">Хранит настройки поставщиков AI. Позволяет указывать настройки поставщика, уточнять вид используемой модели и ключ API. Адреса ресурсов заполняются автоматически для публичных моделей и могут уточняться в случае развертки локальных версий.</p>
