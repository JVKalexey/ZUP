<p style="LINE-HEIGHT: 1.1666"><span style="FONT-WEIGHT: bold">Отчет «Обороты бюджета»</span><span style="FONT-WEIGHT: bold"></span></p>
<p style="LINE-HEIGHT: 1.1666"></p>
<p style="TEXT-ALIGN: justify"> </p>
<p style="TEXT-ALIGN: justify; LINE-HEIGHT: 1.1666">Отчет «Обороты бюджета» показывает обороты по статьям бюджета за выбранный период в разрезе аналитик бюджетирования.</p> 
<p>Бюджет выбирается в форме отчета. Если бюджет не выбран, отчет формируется по статьям оборотов (справочник «Статьи оборотов»).</p>
<p style="TEXT-ALIGN: justify"> </p>
