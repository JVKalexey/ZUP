<p class="MsoNormal" style="TEXT-ALIGN: justify; MARGIN: 0cm 0cm 0pt"><o:p> </o:p></p>
<p class="MsoNormal" style="TEXT-ALIGN: justify; MARGIN: 0cm 0cm 0pt">Отчет <strong>«</strong><b style="mso-bidi-font-weight: normal">Проверка способа компоновки источников<strong>» </strong></b><strong><span style="FONT-WEIGHT: normal; mso-bidi-font-weight: bold">вспомогательный отчет</span></strong> предназначен для проверки настроек компоновки данных. Отчет вызывается из справочника <b style="mso-bidi-font-weight: normal">«Способы компоновки данных».</b></p>
<p class="MsoNormal" style="MARGIN: 0cm 0cm 0pt; mso-outline-level: 1"></p></o:p> </body></html>
